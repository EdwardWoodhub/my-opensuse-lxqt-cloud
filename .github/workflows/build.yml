name: Build LXQt CloudOS Based On openSUSE and Publish ISO

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  schedule:
    - cron: '03 19 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OCI_IMAGE_NAME: my-opensuse-lxqt-cloud
  ISO_BASE_NAME: my-opensuse-lxqt-cloud-iso

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu Runner)
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' 'google-chrome-.*' || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          docker system prune -a -f --volumes || true
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Build Metadata
        id: meta
        run: |
          DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            RELEASE_TAG="nightly-${DATE_TAG}"
            RELEASE_TITLE="Nightly Build (${DATE_TAG})"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="manual-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Manual Build (${DATE_TAG}-${SHORT_SHA})"
          else
            RELEASE_TAG="commit-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Commit Build (${DATE_TAG}-${SHORT_SHA})"
          fi
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${ACTOR_LOWER}/${{ env.OCI_IMAGE_NAME }}" >> $GITHUB_ENV
          echo "CURRENT_ISO_NAME=${{ env.ISO_BASE_NAME }}-${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OS Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.FULL_IMAGE_NAME }}:latest
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          build-args: |
            REPO=${{ env.FULL_IMAGE_NAME }}
            VERSION=${{ env.RELEASE_TAG }}

      - name: Build Bootable ISO and Split if Exceeds 1.5GB
        run: |
          mkdir -p build-output release-assets
          docker run --rm -v $(pwd)/build-output:/build --privileged \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }} \
            elemental --debug build-iso \
            --name ${{ env.CURRENT_ISO_NAME }} \
            --bootloader-in-rootfs \
            -o /build \
            docker:${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}

          ISO_PATH="build-output/${{ env.CURRENT_ISO_NAME }}.iso"
          FILE_SIZE=$(stat -c%s "${ISO_PATH}")
          MAX_SIZE=1572864000
          cd build-output
          sha256sum "${{ env.CURRENT_ISO_NAME }}.iso" > "../release-assets/${{ env.CURRENT_ISO_NAME }}.iso.sha256"

          if [ "${FILE_SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "ISO exceeds 1.5GB, splitting..."
            split -b 1500M -d -a 2 "${{ env.CURRENT_ISO_NAME }}.iso" "${{ env.CURRENT_ISO_NAME }}.iso.part"
            mv ${{ env.CURRENT_ISO_NAME }}.iso.part* ../release-assets/
            cd ../release-assets
            sha256sum ${{ env.CURRENT_ISO_NAME }}.iso.part* >> "${{ env.CURRENT_ISO_NAME }}.iso.sha256"
            echo "IS_SPLIT=true" >> $GITHUB_ENV
          else
            mv "${{ env.CURRENT_ISO_NAME }}.iso" ../release-assets/
            echo "IS_SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ### Elemental OS Image Release
            - **Event:** `${{ github.event_name }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **OCI Image (Latest):** `${{ env.FULL_IMAGE_NAME }}:latest`
            - **OCI Image (Immutable Tag):** `${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}`
            - **Split Files:** `${{ env.IS_SPLIT }}`
            ${{ env.IS_SPLIT == 'true' && format('#### 拼接 ISO 命令：
            ```bash
            cat {0}.iso.part* > {0}.iso
            sha256sum -c {0}.iso.sha256
            ```', env.CURRENT_ISO_NAME) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 手动分区方案：提取 elemental 内容 + 自定义分区大小组装 98G RAW
      # =========================================================================
      - name: Build Custom Partition RAW Disk Image
        run: |
          set -e
          mkdir -p build-output raw-draft-assets work
          RAW_BASE_NAME="${{ env.ISO_BASE_NAME }}-${{ env.RELEASE_TAG }}"
          RAW_FILE="build-output/${RAW_BASE_NAME}.raw"

          echo "==> 1. 让 elemental 生成临时内容（提取 recovery、EFI、grub.cfg 等）..."
          docker run --rm \
            -v $(pwd)/work:/work \
            --privileged \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }} \
            elemental --debug build-disk \
            --name temp \
            --output /work \
            --type raw \
            --system "docker:${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}" || true

          echo "==> 临时目录结构："
          find work -type d -name "EFI" -o -name "grub.cfg" -o -name "recovery.img" | head -20

          # 查找关键文件
          RECOVERY_IMG=$(find work -name "recovery.img" | head -n 1)
          EFI_SRC=$(find work -type d -name "EFI" | head -n 1)
          GRUB_CFG=$(find work -name "grub.cfg" | head -n 1)
          GRUB_OEM_ENV=$(find work -name "grub_oem_env" | head -n 1)

          echo "Recovery img: ${RECOVERY_IMG}"
          echo "EFI dir: ${EFI_SRC}"
          echo "grub.cfg: ${GRUB_CFG}"
          echo "grub_oem_env: ${GRUB_OEM_ENV}"

          echo "==> 2. 创建 98G RAW 磁盘..."
          truncate -s 98G "${RAW_FILE}"

          echo "==> 3. 分区：EFI 64M + OEM 64M + Recovery 8G + State 30G + Persistent 剩余..."
          sgdisk -o "${RAW_FILE}"
          sgdisk -n=1:2048:+64M -c=1:efi -t=1:EF00 "${RAW_FILE}"
          sgdisk -n=2:0:+64M -c=2:oem -t=2:8300 "${RAW_FILE}"
          sgdisk -n=3:0:+8G -c=3:recovery -t=3:8300 "${RAW_FILE}"
          sgdisk -n=4:0:+30G -c=4:state -t=4:8300 "${RAW_FILE}"
          sgdisk -n=5:0:0 -c=5:persistent -t=5:8300 "${RAW_FILE}"

          echo "==> 4. 挂载 loop 并格式化..."
          LOOP=$(sudo losetup -f --show -P "${RAW_FILE}")
          echo "Loop device: ${LOOP}"

          sudo mkfs.vfat -n COS_GRUB "${LOOP}p1"
          sudo mkfs.ext4 -L COS_OEM "${LOOP}p2"
          sudo mkfs.ext4 -L COS_RECOVERY "${LOOP}p3"
          sudo mkfs.btrfs -L COS_STATE -f "${LOOP}p4"
          sudo mkfs.ext4 -L COS_PERSISTENT "${LOOP}p5"

          echo "==> 5. 写入内容..."
          mkdir -p mnt

          # 5.1 写入 EFI 分区（完整 EFI 目录 + grub.cfg + grub_oem_env）
          sudo mount "${LOOP}p1" mnt
          if [ -n "${EFI_SRC}" ]; then
            echo "Copying EFI directory..."
            sudo cp -a "${EFI_SRC}" mnt/
          fi
          if [ -n "${GRUB_CFG}" ]; then
            echo "Copying grub.cfg..."
            sudo mkdir -p mnt/EFI/BOOT mnt/EFI/ELEMENTAL mnt/grub
            sudo cp "${GRUB_CFG}" mnt/EFI/BOOT/grub.cfg || true
            sudo cp "${GRUB_CFG}" mnt/EFI/ELEMENTAL/grub.cfg || true
            sudo cp "${GRUB_CFG}" mnt/grub/grub.cfg || true
          fi
          if [ -n "${GRUB_OEM_ENV}" ]; then
            echo "Copying grub_oem_env..."
            sudo cp "${GRUB_OEM_ENV}" mnt/grub_oem_env || true
            sudo cp "${GRUB_OEM_ENV}" mnt/grub/grubenv || true
          fi
          echo "EFI partition content:"
          sudo find mnt -type f | head -30
          sudo umount mnt

          # 5.2 写入 Recovery 分区
          if [ -n "${RECOVERY_IMG}" ]; then
            sudo mount "${LOOP}p3" mnt
            sudo mkdir -p mnt/boot
            sudo cp "${RECOVERY_IMG}" mnt/boot/recovery.img
            # 额外拷贝内核和 initrd
            find work -name "vmlinuz*" -exec sudo cp {} mnt/boot/ \; || true
            find work -name "initrd*" -exec sudo cp {} mnt/boot/ \; || true
            sudo umount mnt
          fi

          # 5.3 State 分区（btrfs 基础结构）
          sudo mount "${LOOP}p4" mnt
          sudo btrfs subvolume create mnt/@ || true
          sudo btrfs subvolume create mnt/@/.snapshots || true
          sudo umount mnt

          sudo losetup -d "${LOOP}"
          rm -rf mnt

          echo "==> 6. 压缩 RAW..."
          XZ_FILE="raw-draft-assets/${RAW_BASE_NAME}.raw.xz"
          xz -T0 -v -6 < "${RAW_FILE}" > "${XZ_FILE}"
          rm -f "${RAW_FILE}"

          cd raw-draft-assets
          sha256sum "$(basename "${XZ_FILE}")" > "$(basename "${XZ_FILE}").sha256"
          ls -lh

      - name: Publish Draft Release (RAW Disk Image)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}-raw"
          name: "${{ env.RELEASE_TITLE }} [RAW Draft]"
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          files: raw-draft-assets/*
          body: |
            ### Elemental Bootable RAW Disk Image (Draft) - Custom Partitions
            - **Disk size:** 98G
            - **Recovery:** 8G
            - **State:** 30G
            - **Persistent:** remaining space
            - **Note:** Manually assembled with EFI/GRUB content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          FULL_IMAGE_NAME: ${{ env.FULL_IMAGE_NAME }}
          OCI_IMAGE_NAME: ${{ env.OCI_IMAGE_NAME }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: |
          set -e
          if [ -z "$ACR_REGISTRY" ] || [ -z "$ACR_NAMESPACE" ]; then
            echo "Error: ALIYUN_ACR_REGISTRY or ALIYUN_ACR_NAMESPACE secret is not set!"
            exit 1
          fi
          GHCR_TAG_IMAGE="${FULL_IMAGE_NAME}:${RELEASE_TAG}"
          ALIYUN_TAG_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${OCI_IMAGE_NAME}:${RELEASE_TAG}"
          ALIYUN_LATEST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${OCI_IMAGE_NAME}:latest"
          if ! docker image inspect "$GHCR_TAG_IMAGE" >/dev/null 2>&1; then
            docker pull "$GHCR_TAG_IMAGE"
          fi
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_TAG_IMAGE"
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_LATEST_IMAGE"
          docker push "$ALIYUN_TAG_IMAGE"
          docker push "$ALIYUN_LATEST_IMAGE"
